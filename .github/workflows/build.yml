name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure & Build APK
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create . --org com.example --project-name staff_manger
          cp -f ../lib/main.dart ./lib/main.dart
          cp -f ../pubspec.yaml ./pubspec.yaml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
